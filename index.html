<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Brenner Abroad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Archivo+Narrow:wght@700&family=Caveat:wght@500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@900&text=%E6%88%90%E7%94%B0%E4%B8%8A%E6%B5%B7%E8%A5%BF%E5%AE%89%E5%8C%97%E4%BA%AC%E6%9D%B1&display=swap">
<style>
  /* Layout: departure board up top, then a scroll story. A sticky route map draws the line as each city's chapter scrolls past. */
  :root{
    --bg:#F4F6FB; --surface:#FFFFFF; --surface-2:#ECEFF7; --ink:#14152B; --ink-2:#3B3E5C; --ink-3:#686B8A; --line:#D9DDEB;
    --sea:#CFE2F2; --land:#FFFFFF; --land-cn:#FFF1DD; --border:#A9BCD3;
    --board:#121428; --board-2:#1C1F3A; --board-fg:#FFC83D; --board-dim:#9195B8; --board-ok:#5BE3A1;
    --narita-band:#D93A23; --shanghai-band:#0A84B8; --xian-band:#C4561A; --beijing-band:#B50E2A; --tokyo-band:#F2B705;
    --narita:#C7341E; --shanghai:#00739E; --xian:#A84A12; --beijing:#B50E2A; --tokyo:#946600;
    --pick:#0E7A55; --pick-soft:#D5F2E4;
    --shadow:0 1px 2px rgba(20,21,43,.06),0 18px 40px -24px rgba(20,21,43,.45);
    --f-display:"Big Shoulders Display","Arial Narrow","Helvetica Neue",sans-serif;
    --f-body:Figtree,"Segoe UI",system-ui,sans-serif;
    --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
    --f-cjk:"Noto Serif SC","Songti SC","STSong",serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0D0F1F; --surface:#161935; --surface-2:#1E2244; --ink:#EEF0FA; --ink-2:#C3C7E1; --ink-3:#8F93B4; --line:#2A2F55;
      --sea:#0E1A31; --land:#1B2040; --land-cn:#2B2340; --border:#3B4672;
      --narita:#FF7A5E; --shanghai:#3CC3F0; --xian:#F59A5C; --beijing:#FF6B78; --tokyo:#FFC93C;
      --pick:#5BE3A1; --pick-soft:#123A2B;
      --shadow:0 1px 2px rgba(0,0,0,.5),0 18px 40px -22px rgba(0,0,0,.9);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0D0F1F; --surface:#161935; --surface-2:#1E2244; --ink:#EEF0FA; --ink-2:#C3C7E1; --ink-3:#8F93B4; --line:#2A2F55;
    --sea:#0E1A31; --land:#1B2040; --land-cn:#2B2340; --border:#3B4672;
    --narita:#FF7A5E; --shanghai:#3CC3F0; --xian:#F59A5C; --beijing:#FF6B78; --tokyo:#FFC93C;
    --pick:#5BE3A1; --pick-soft:#123A2B;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 18px 40px -22px rgba(0,0,0,.9);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
  .gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .inner{max-width:1240px;margin:0 auto}
  p{margin:0 0 .85em}
  a{color:inherit}
  button{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--shanghai);outline-offset:2px}
  .narita{--band:var(--narita-band);--acc:var(--narita);--on:#FFFFFF}
  .shanghai{--band:var(--shanghai-band);--acc:var(--shanghai);--on:#FFFFFF}
  .xian{--band:var(--xian-band);--acc:var(--xian);--on:#FFFFFF}
  .beijing{--band:var(--beijing-band);--acc:var(--beijing);--on:#FFFFFF}
  .tokyo{--band:var(--tokyo-band);--acc:var(--tokyo);--on:#14152B}

  /* ---------- hero: the title over a slow slideshow of the cities, with a small split-flap board beneath it ---------- */
  .hero{position:relative;background:#171512;min-height:min(88vh,820px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,3.5vh,34px);padding-block:clamp(56px,10vh,120px) clamp(56px,9vh,96px);overflow:hidden}
  .slides{position:absolute;inset:-8% 0;will-change:transform}
  /* every slide drifts in and out of its zoom the whole time, so a crossfade never changes a transform; only opacity moves */
  .slides img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 3s ease-in-out;will-change:opacity,transform;animation:kb 26s ease-in-out infinite alternate}
  .slides img:nth-child(2){animation-delay:-9s}.slides img:nth-child(3){animation-delay:-17s}.slides img:nth-child(4){animation-delay:-5s}.slides img:nth-child(5){animation-delay:-21s}
  .slides img.on{opacity:1}
  @keyframes kb{from{transform:scale(1)}to{transform:scale(1.08)}}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,11,9,.42) 0%,rgba(14,11,9,.38) 45%,rgba(14,11,9,.7) 100%);pointer-events:none}
  .hero-title{position:relative;z-index:1;font-family:var(--f-display);font-weight:900;font-size:clamp(64px,15vw,168px);line-height:.86;letter-spacing:.01em;text-transform:uppercase;color:#FFFFFF;text-align:center;margin:0;padding-inline:16px;text-wrap:balance;text-shadow:0 6px 36px rgba(0,0,0,.6)}
  .hero .inner{position:relative;z-index:1;width:100%;max-width:560px;margin:0}
  .credits{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);margin:6px 0 0;line-height:1.6}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  /* a handwritten note on lined paper, taped under the board */
  .note-wrap{position:relative;z-index:1;width:100%;max-width:460px;padding-inline:20px;margin-top:6px}
  .note{position:relative;background:#FBF5E4;color:#2A2420;padding:24px 22px 18px;border-radius:2px;transform:rotate(-1.4deg);box-shadow:0 22px 44px -18px rgba(0,0,0,.75),0 2px 4px rgba(0,0,0,.25);background-image:repeating-linear-gradient(transparent 0 29px,rgba(70,90,130,.16) 29px 30px);background-position:0 18px}
  .note::before{content:"";position:absolute;top:-13px;left:50%;width:118px;height:28px;margin-left:-59px;background:rgba(255,241,190,.55);border:1px solid rgba(255,255,255,.35);transform:rotate(-2.5deg);box-shadow:0 1px 3px rgba(0,0,0,.18)}
  .dek{font-family:Caveat,"Bradley Hand","Segoe Print",cursive;font-size:24px;line-height:30px;margin:0;color:#2A2420;white-space:pre-line;font-weight:500}
  @media (max-width:600px){.note-wrap{max-width:100%;padding-inline:16px}.note{padding:22px 18px 16px}}

  /* ---------- split-flap departures board ---------- */
  .solari{--tw:16px;--th:21px;--cg:10px;--f-flap:"Archivo Narrow","Arial Narrow","Helvetica Neue",sans-serif;--sol-house:#171512;--sol-frame:#3D362E;--sol-fg:#FFFCF2;--sol-lab:#C9B88F;color:var(--sol-fg)}
  .sol-house{background:var(--sol-house);border:3px solid var(--sol-frame);border-radius:7px;box-shadow:inset 0 0 0 1px #080706,inset 0 30px 60px -40px rgba(0,0,0,.9),0 30px 60px -30px rgba(0,0,0,.95);overflow:hidden}
  .sol-head{display:flex;justify-content:space-between;gap:10px;padding:10px 14px 0}
  .plate{font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--sol-lab);white-space:nowrap}
  .sol-scroll{container-type:inline-size;overflow-x:auto;padding:10px 12px 12px;scrollbar-color:#5A5048 transparent}
  /* tiles grow to fill the board, 21 tiles plus 3 column gaps, and shrink to 12px before the board scrolls sideways */
  @supports (width:1cqw){.sol-scroll{--tw:clamp(12px,calc((100cqw - 3*var(--cg) - 20px)/21),26px);--th:calc(var(--tw)*1.36)}}
  .sol-cols,.sol-row{display:flex;gap:var(--cg);width:max-content}
  .sol-cols{padding:0 0 6px}
  .sol-cols span{font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--sol-lab);padding-left:2px;flex:none}
  .sol-row{padding:6px 0;border-top:1px solid #090807}
  .sol-row.first{border-top:0}
  .sol-cell{display:flex;gap:1px}
  .tile{position:relative;width:var(--tw);height:var(--th);border-radius:1.5px;background:#0B0B0D;font-family:var(--f-flap);font-weight:700;font-size:calc(var(--th)*.94);letter-spacing:-.01em;color:var(--sol-fg);text-transform:uppercase;perspective:140px;flex:none}
  .hf{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:#1C1C20}
  .hf i{position:absolute;left:0;right:0;height:var(--th);line-height:var(--th);text-align:center;font-style:normal}
  .hi{top:0;border-radius:1.5px 1.5px 0 0}
  .hi i{top:0}
  .lo{bottom:0;border-radius:0 0 1.5px 1.5px;background:#18181C}
  .lo i{bottom:0}
  .fp{top:0;border-radius:1.5px 1.5px 0 0;transform-origin:50% 100%;backface-visibility:hidden}
  .fp i{top:0}
  .tile.go .fp{animation:flap 70ms ease-in both}
  @keyframes flap{from{transform:rotateX(0)}to{transform:rotateX(-88deg)}}
  .tile::after{content:"";position:absolute;left:0;right:0;top:calc(50% - .5px);height:1px;background:#000;z-index:3}

  /* ---------- continuous scroll: things ease in as they arrive ---------- */
  .rv{opacity:0;transform:translateY(22px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
  .rv.in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}}

  /* ---------- the stops: poster cards that stack as you scroll; tap one to open the detail panel ---------- */
  .inner.journey{padding-block:30px 40px}
  .chapters{display:flex;flex-direction:column;gap:20px}
  main .chapter{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:0}
  .ch-open{position:relative;display:block;width:100%;aspect-ratio:4/5;max-height:76vh;padding:0;border:0;border-radius:16px;overflow:hidden;background:var(--band);color:#FFFFFF;cursor:pointer;box-shadow:0 34px 60px -28px rgba(0,0,0,.75);transition:transform .45s cubic-bezier(.2,.7,.2,1);font:inherit;text-align:left}
  @media (min-width:700px){.ch-open{aspect-ratio:16/9;max-height:620px}}
  .ch-open:hover{transform:translateY(-4px)}
  .ch-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
  .ch-open:hover .ch-img{transform:scale(1.05)}
  .ch-open::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.06) 30%,rgba(0,0,0,.62) 100%)}
  @supports (color:color-mix(in srgb,red,blue)){.ch-open::after{background:linear-gradient(180deg,rgba(0,0,0,0) 32%,color-mix(in srgb,var(--band) 55%,rgba(0,0,0,.85)) 100%)}}
  .ch-kanji{position:absolute;z-index:1;top:6px;right:14px;font-family:var(--f-cjk);font-weight:900;font-size:clamp(110px,30vw,240px);line-height:.92;letter-spacing:-.04em;color:#FFFFFF;opacity:.32;pointer-events:none}
  .ch-meta{position:absolute;z-index:1;left:20px;right:88px;bottom:20px;text-shadow:0 2px 16px rgba(0,0,0,.55)}
  .ch-meta .num{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.85}
  .ch-meta h2{font-family:var(--f-display);font-weight:900;font-size:clamp(46px,11vw,96px);line-height:.88;text-transform:uppercase;margin:4px 0 6px;color:#FFFFFF}
  .ch-meta .when{display:block;font-family:var(--f-mono);font-size:12px;opacity:.92}
  .ch-more{position:absolute;z-index:1;right:18px;bottom:20px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1.5px solid rgba(255,255,255,.75);color:#FFFFFF;font-size:30px;font-weight:300;line-height:47px;text-align:center;transition:transform .35s cubic-bezier(.2,.7,.2,1),background .35s,color .35s}
  .ch-open:hover .ch-more{background:#FFFFFF;color:#14152B;transform:rotate(90deg)}
  dialog.detail{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(780px,94vw);max-height:90vh;border-radius:8px;box-shadow:var(--shadow);overflow:auto;overscroll-behavior:contain}
  dialog.detail::backdrop{background:rgba(8,10,24,.8)}
  dialog.detail .band{border-radius:8px 8px 0 0;position:sticky;top:0;z-index:2}
  .dt-close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.28);color:inherit;font-size:24px;line-height:36px;text-align:center;cursor:pointer;padding:0}
  .dt-body{padding:18px 20px 26px}
  .dt-body .lede{font-size:17px;margin-bottom:14px}
  .dt-stay{margin:20px 0 0;padding-top:14px;border-top:1px solid var(--line);font-family:var(--f-mono);font-size:12.5px;line-height:1.6;color:var(--ink-2)}
  .dt-stay b{color:var(--ink);font-weight:600}
  .dt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
  @media (max-width:600px){.dt-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.dt-body{padding:14px 14px 22px}}

  /* ---------- phone proportions: this page is mostly shared on phones ---------- */
  @media (max-width:600px){
    .hero{min-height:min(92vh,760px);gap:22px;padding-block:72px 60px}
    .hero-title{font-size:clamp(60px,19vw,88px)}
    .chapter .band .cjk{font-size:58px}
    .chapter .band h2{font-size:38px}
    .chapter .band .when{font-size:12px}
    .chapter .band{padding:16px 16px 14px;gap:4px}
    main .chapter{padding-bottom:44px}
    .ch-body .lede{font-size:17px}
    .inner.journey{padding-block:22px 0}
    .chapter h3.sub{font-size:21px;margin:22px 0 8px}
    .now .map-title h2{font-size:28px}
  }

  /* ---------- journey layout ---------- */
  .journey{padding-block:40px 0}.chapters{max-width:980px;margin:0 auto}
  .now{padding-block:44px 24px;border-top:1px solid var(--line);margin-top:10px}.now .wrap{max-width:880px}.now .now-at{margin:0 0 14px}.now-at.home{--band:var(--board);--acc:var(--ink)}
  
  .map-card{background:var(--sea);border-radius:6px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
  .map-card svg{display:block;width:100%;height:auto}
  .map-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 10px}
  .map-title h2{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:30px;line-height:1;margin:0;letter-spacing:.01em}
  .map-title span{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}.map-title h2{font-size:clamp(28px,4vw,40px)}
  .land path{fill:var(--land);stroke:var(--border);stroke-width:.9;stroke-linejoin:round}
  .land path.cn{fill:var(--land-cn)}
  .ctry{font-family:var(--f-mono);font-size:12px;letter-spacing:.34em;fill:var(--ink-3)}
  .leg-base{fill:none;stroke:var(--ink-3);stroke-width:2;opacity:.35;stroke-linecap:round}
  .leg-base.fly{stroke-dasharray:2 6}
  .leg-prog{fill:none;stroke:var(--ink);stroke-width:3.4;stroke-linecap:round}
  .leglab{font-family:var(--f-mono);font-size:11px;fill:var(--ink-2);paint-order:stroke;stroke:var(--sea);stroke-width:4px;stroke-linejoin:round}
  .city{cursor:pointer}
  .city .ring{fill:var(--band);opacity:0;transition:opacity .3s, r .3s}
  .city.on .ring{opacity:.28}
  .city .dot{fill:var(--band);stroke:var(--land);stroke-width:3;transition:r .3s}
  .city text{font-family:var(--f-display);font-weight:800;font-size:19px;text-transform:uppercase;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:5px;stroke-linejoin:round;letter-spacing:.02em}
  .city text.sub{font-family:var(--f-mono);font-weight:400;font-size:11px;text-transform:none;fill:var(--ink-3)}
  .city.on text:not(.sub){fill:var(--acc)}
  .map-key{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px}
  .map-key span{display:inline-flex;gap:6px;align-items:center}
  .now-at{margin-top:14px;display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
  .now-at .cjk-sm{font-family:var(--f-cjk);font-weight:900;font-size:30px;line-height:1;color:var(--acc)}
  .now-at b{font-family:var(--f-display);text-transform:uppercase;font-size:20px;letter-spacing:.02em;display:block;line-height:1.05}
  .now-at small{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
  

  /* mobile route strip */
  .strip{display:none}
  @media (max-width:1000px){
    .strip{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin:22px calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;padding:8px max(16px,env(safe-area-inset-left,0px));gap:4px;overflow-x:auto}
    .strip button{flex:1 0 auto;border:0;background:transparent;font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:15px;letter-spacing:.03em;color:var(--ink-3);padding:6px 8px;border-bottom:3px solid transparent;cursor:pointer}
    .strip button.on{color:var(--acc);border-bottom-color:var(--band)}
  }

  /* ---------- chapters ---------- */
  .chapter{padding-bottom:72px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 64px)}
  .band{background:var(--band);color:var(--on);border-radius:6px 6px 0 0;padding:20px 22px 18px;display:flex;gap:18px;align-items:flex-end;position:relative;overflow:hidden}
  .band .cjk{font-family:var(--f-cjk);font-weight:900;font-size:clamp(70px,11vw,118px);line-height:.85;opacity:.95;flex:none;letter-spacing:-.02em}
  .band .num{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;opacity:.85;margin:0 0 4px}
  .band h2{font-family:var(--f-display);font-weight:900;font-size:clamp(46px,7vw,76px);line-height:.88;text-transform:uppercase;margin:0;letter-spacing:.005em}
  .band .when{font-family:var(--f-mono);font-size:13px;margin:8px 0 0;opacity:.95}
  @media (max-width:520px){.band{flex-direction:column;align-items:flex-start;gap:6px}}
  .ch-hero{margin:0;position:relative;background:var(--surface-2)}
  .ch-hero button{display:block;width:100%;padding:0;border:0;cursor:zoom-in;background:none}
  .ch-hero img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;max-width:100%}
  .ch-hero figcaption{position:absolute;left:0;bottom:0;right:0;padding:24px 14px 10px;font-size:13px;color:#FFFFFF;background:linear-gradient(180deg,transparent,rgba(8,10,24,.75));pointer-events:none}
  .ch-body{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 6px 6px;padding:22px 22px 26px;box-shadow:var(--shadow)}
  @media (max-width:520px){.ch-body,.band{padding-left:16px;padding-right:16px}}
  .lede{font-size:clamp(18px,2vw,20px);line-height:1.5;color:var(--ink);max-width:56ch}
  .tickets{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:18px 0 6px}
  .ticket{border:1.5px dashed var(--acc);border-radius:6px;padding:12px 14px;position:relative;background:var(--surface)}
  .ticket .lbl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--acc);margin:0 0 4px}
  .ticket strong{font-family:var(--f-display);font-weight:800;font-size:23px;text-transform:uppercase;line-height:1;display:block;letter-spacing:.01em}
  .ticket .zh{font-size:14px;color:var(--ink-2);margin-top:4px}
  .ticket .facts{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);margin-top:6px;line-height:1.5}

function onScroll(){
  const secs=[...document.querySelectorAll(".chapter")], mid=innerHeight*0.45;
  let prog=0, cur=0;
  secs.forEach((sec,i)=>{const r=sec.getBoundingClientRect(); if(r.top<=mid){cur=i; const f=Math.min(1,Math.max(0,(mid-r.top)/r.height)); prog=i+f}});
  const first=secs[0].getBoundingClientRect().top;
  if(first>mid) prog=Math.max(0,1-(first-mid)/innerHeight)*0.999-1;
  setActive(cur);

/* ---------- split-flap departures board ---------- */
const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;
// like a real board, a letter tile only carries letters and a number tile only digits; colons are printed, not flipped
const LETTERS=" ABCDEFGHIJKLMNOPQRSTUVWXYZ", DIGITS=" 0123456789";
const setFor=ch=>/[0-9]/.test(ch)?DIGITS:/[A-Z]/.test(ch)?LETTERS:ch==="+"?DIGITS+"+":(ch==="/"||ch==="'")?LETTERS+ch:null;
const COLS=[{k:"mon",w:3,l:"Date"},{k:"day",w:2,l:""},{k:"from",w:8,l:"From"},{k:"to",w:8,l:"To"}];
const LEGS=[
 {mon:"Nov",day:"11",from:"Honolulu",to:"Narita"},
 {mon:"Nov",day:"13",from:"Narita",to:"Shanghai"},
 {mon:"Nov",day:"19",from:"Shanghai",to:"Xi'an"},
 {mon:"Nov",day:"22",from:"Xi'an",to:"Beijing"},
 {mon:"Nov",day:"27",from:"Beijing",to:"Tokyo"},
 {mon:"Dec",day:" 6",from:"Tokyo",to:"Honolulu"}];

const tileHTML=ch=>`<span class="tile" data-t="${esc(ch)}"><span class="hf hi"><i> </i></span><span class="hf lo"><i> </i></span><span class="hf fp"><i> </i></span></span>`;
function buildBoard(){
  const host=document.getElementById("solari"),cols=document.getElementById("sol-cols"),tb=document.querySelector("#sol-table tbody");
  cols.innerHTML=COLS.map(c=>`<span style="width:calc(${c.w}*var(--tw) + ${c.w-1}px)">${c.l}</span>`).join("");
  tb.innerHTML=LEGS.map(r=>`<tr><td>${esc(r.mon+" "+r.day.trim())}</td><td>${esc(r.from)}</td><td>${esc(r.to)}</td></tr>`).join("");
  host.innerHTML=LEGS.map((r,ri)=>`<div class="sol-row${ri===0?" first":""}">${COLS.map(c=>{
    const v=(r[c.k]||"").toUpperCase().padEnd(c.w).slice(0,c.w);
    return `<div class="sol-cell">${[...v].map(tileHTML).join("")}</div>`}).join("")}</div>`).join("");
  const rows=[...host.querySelectorAll(".sol-row")];
  const setChar=(t,ch)=>t.querySelectorAll("i").forEach(i=>i.textContent=ch);
  if(REDUCED){rows.forEach(r=>r.querySelectorAll(".tile").forEach(t=>setChar(t,t.dataset.t)));return}
  // every tile flips from blank to its letter, row by row, left to right
  const run=full=>rows.forEach((row,ri)=>row.querySelectorAll(".tile").forEach((t,ti)=>{
    const target=t.dataset.t; if(target===" "||t.dataset.busy)return;
    setTimeout(()=>flipTo(t,target,full),ri*150+ti*14);
  }));
  // the board flips in once it is on screen, then every minute the whole board cycles round again, the way a real one refreshes
  let started=false;
  const start=()=>{if(started)return;started=true;setTimeout(()=>run(false),300);
    setInterval(()=>{if(document.visibilityState==="visible")run(true)},60000)};
  const sec=document.querySelector(".solari");
  if("IntersectionObserver" in window){const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){start();io.disconnect()}},{threshold:.15});io.observe(sec);setTimeout(start,6000)}
  else setTimeout(start,400);
}
function flipTo(t,target,full){
  const hi=t.querySelector(".hi i"),lo=t.querySelector(".lo i"),fp=t.querySelector(".fp i"),SET=setFor(target);
  if(!SET){[hi,lo,fp].forEach(i=>i.textContent=target);return}
  const N=SET.length,tgt=SET.indexOf(target);
  let cur=lo.textContent, idx=Math.max(0,SET.indexOf(cur));
  let left=((tgt-idx)%N+N)%N; if(left===0&&full)left=N;
  t.dataset.busy="1";
  const step=()=>{
    if(left===0){t.classList.remove("go");delete t.dataset.busy;return}
    left--; idx=(idx+1)%N; const next=SET[idx];
    hi.textContent=next; fp.textContent=cur;
    t.classList.remove("go"); void t.offsetWidth; t.classList.add("go");
    let fired=false;
    const done=()=>{if(fired)return;fired=true;lo.textContent=next;fp.textContent=next;cur=next;step()};
    t.addEventListener("animationend",done,{once:true}); setTimeout(done,150);
  };
  step();
}

/* ---------- behind the board: the cities, one photo each, in route order ---------- */
const SLIDES=[{ph:"narita-1",city:"Narita"},{ph:"shanghai-skyline",city:"Shanghai"},{ph:"xian-4",city:"Xi'an"},{ph:"beijing-1",city:"Beijing"},{ph:"tokyo-shibuya",city:"Tokyo"}];
function buildSlides(){
  const host=document.getElementById("slides"); if(!host)return;
  const imgs=SLIDES.map(s=>{const im=document.createElement("img");im.src="photos/"+s.ph+".jpg";im.alt="";im.decoding="async";host.appendChild(im);return im});
  // decode every slide up front so the first crossfade onto each one never waits on a JPEG decode
  imgs.forEach(im=>{if(im.decode)im.decode().catch(()=>{})});
  const credits=document.getElementById("credits");
  if(credits)credits.textContent="Background photos: "+SLIDES.map(s=>{const p=PHOTOS[s.ph];return p.lic==="CC0"?`${s.city} by ${p.by} (public domain)`:`${s.city} by ${p.by} (${p.lic})`}).join(" · ")+" · via Wikimedia Commons.";
  let i=0;
  const show=n=>imgs.forEach((im,k)=>im.classList.toggle("on",k===n));
  show(0);
  if(REDUCED||imgs.length<2)return;
  setInterval(()=>{if(document.visibilityState!=="visible")return;i=(i+1)%imgs.length;show(i)},8000);
}

function openDetail(id){
  const s=STOPS.find(x=>x.id===id),st=s.stay,D=document.getElementById("detail"); if(!s||!D)return;
  D.className="detail "+s.id;
  D.innerHTML=`<div class="band"><span class="cjk" lang="${s.id==="narita"||s.id==="tokyo"?"ja":"zh"}">${s.cjk}</span>
      <div><h2>${esc(s.name)}</h2><p class="when">${esc(s.dates)} · ${esc(s.nights)}</p></div>
      <button type="button" class="dt-close" data-close aria-label="Close">×</button></div>
    <div class="dt-body">
      <p class="lede">${esc(s.lede)}</p>
      <h3 class="sub">Cool stuff</h3>
      <div class="dt-grid">${s.gallery.map(g=>`<div class="card"><button type="button" data-ph="${g.ph}" data-set="${s.id}" aria-label="Open photo: ${esc(g.n)}"><img src="photos/${g.ph}.jpg" alt="${esc(PHOTOS[g.ph].cap)}" loading="lazy"></button><div class="txt"><b>${esc(g.n)}</b><small>${esc(g.note)}</small></div></div>`).join("")}</div>
      <p class="dt-stay">${st.status==="ok"?`Staying at <b>${esc(st.name)}</b>, ${esc(st.zh)}${st.facts?` · ${esc(st.facts)}`:""}`:`Where I'm staying: <b>not booked yet</b> · ${esc(st.zh)}`}</p>
    </div>`;
  D.querySelector("[data-close]").onclick=()=>D.close();
  D.onclick=e=>{if(e.target===D){D.close();return}const b=e.target.closest("[data-ph]");if(b)openViewer(b.dataset.set,b.dataset.ph)};
  if(D.showModal)D.showModal();else D.setAttribute("open","");
  D.scrollTop=0;
}
renderChapters2(); buildBoard(); buildSlides(); reveals();
</script>
